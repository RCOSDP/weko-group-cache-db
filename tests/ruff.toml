line-length = 120
target-version = "py314"

[lint]
ignore = [
  "D",
  "assert",
  "ANN",
  "missing-trailing-comma",
  "runtime-cast-value",
  "call-datetime-now-without-tzinfo",
  "import-private-name",
  "private-member-access",
  "yoda-conditions",
]
preview = true
select = ["ALL"]

[lint.isort]
combine-as-imports = true
known-first-party = ["weko_group_cache_db"]
lines-between-types = 1
